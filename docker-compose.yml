version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: empathylink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: empathy_user
      POSTGRES_PASSWORD: empathy_pass
      POSTGRES_DB: empathylink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empathy_user -d empathylink"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: empathylink-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: empathylink-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: empathylink-api
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://empathy_user:empathy_pass@postgres:5432/empathylink?schema=public"
      REDIS_URL: "redis://redis:6379"
      PORT: 4000
      JWT_ACCESS_SECRET: "development_super_secret_access_key_min_32_bytes_long_safe_dev_only!"
      JWT_REFRESH_SECRET: "development_super_secret_refresh_key_min_32_bytes_long_safe_dev_only!"
      OPENAI_API_KEY: "mock-key"
      OPENAI_MODEL: "gpt-4o-mini"
      S3_ENDPOINT: "http://minio:9000"
      S3_REGION: "us-east-1"
      S3_BUCKET: "empathylink-media"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
      S3_PUBLIC_URL: "http://localhost:9000/empathylink-media"
      CORS_ORIGIN: "http://localhost:3000"
      NODE_ENV: "production"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: empathylink-web
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      PORT: 3000
      API_URL: "http://api:4000"
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
      NEXT_PUBLIC_SOCKET_URL: "http://localhost:4000"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
